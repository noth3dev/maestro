name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

  test:
    name: Vitest with PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: maestro_test
          POSTGRES_PASSWORD: maestro_test
          POSTGRES_DB: maestro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maestro_test -d maestro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MAESTRO_TEST_DATABASE_URL: postgresql://maestro_test:maestro_test@127.0.0.1:5432/maestro_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Workspace package exports point at dist/; each job has its own runner,
      # so the test job must build before Vitest resolves those entrypoints.
      - name: Build workspace packages
        run: npm run build

      - name: Run Vitest
        run: npm test -- --pool forks --maxWorkers 1
