name: Prepare release artifact

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and package CLI (publish remains manual)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Pack publish-ready CLI
        run: mkdir -p release-artifacts && npm pack --workspace=@maestro/cli --pack-destination release-artifacts
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: maestro-cli-package
          path: release-artifacts/*.tgz
          if-no-files-found: error
